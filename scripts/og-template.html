<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:'Press Start 2P', monospace;
    background:#0a0a0a;
    color:#ededed;
    position:relative;
    overflow:hidden;
  }
  /* faint pixel dot-grid — эхо WebGL пиксель-фона */
  .grid {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    mask-image:linear-gradient(120deg, #000 0%, transparent 78%);
    -webkit-mask-image:linear-gradient(120deg, #000 0%, transparent 78%);
  }
  /* мятный акцентный глоу в углу */
  .glow {
    position:absolute; right:-140px; bottom:-160px;
    width:620px; height:620px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,255,157,0.16), rgba(0,255,157,0) 62%);
    filter:blur(6px);
  }
  .glow2 {
    position:absolute; left:-120px; top:-140px;
    width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,0,255,0.07), rgba(255,0,255,0) 60%);
  }
  /* тонкая рамка как у карточек сайта */
  .frame { position:absolute; inset:26px; border:2px solid rgba(255,255,255,0.10); border-radius:18px; }
  .wrap { position:relative; height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 80px; }
  .prompt { color:#00ff9d; font-size:17px; letter-spacing:1px; margin-bottom:34px; display:flex; align-items:center; gap:12px; }
  .prompt .caret { width:12px; height:20px; background:#00ff9d; display:inline-block; }
  h1 { font-size:52px; line-height:1.28; color:#fff; text-shadow:0 0 18px rgba(0,255,157,0.18); }
  .role { font-size:23px; line-height:1.5; color:#b9c0c9; margin-top:26px; }
  .role b { color:#00ff9d; font-weight:400; }
  .pills { display:flex; gap:14px; margin-top:44px; flex-wrap:wrap; }
  .pill {
    font-size:14px; color:#e6e6e6;
    padding:13px 18px; border:1.5px solid rgba(255,255,255,0.16);
    border-radius:999px; background:rgba(17,24,39,0.55);
  }
  .foot { position:absolute; right:80px; bottom:60px; font-size:15px; color:#6b7280; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow2"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="wrap">
    <div class="prompt">mmalabugin.ru<span class="caret"></span></div>
    <h1>Михаил Алабугин</h1>
    <div class="role">frontend-разработчик · <b>аудит и ускорение сайтов</b></div>
    <div class="pills">
      <span class="pill">Next.js</span>
      <span class="pill">React</span>
      <span class="pill">TypeScript</span>
      <span class="pill">Core Web Vitals</span>
    </div>
  </div>
  <div class="foot">Performance · SEO · A11y</div>
</body>
</html>
