<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Нет соединения — mmalabugin.ru</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0a0a0a;
      color: #ededed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .box { padding: 24px; max-width: 420px; }
    h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: #e2e8f1; line-height: 1.7; margin: 0 0 24px; }
    button {
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    button:hover { border-color: #3b82f6; color: #3b82f6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Нет соединения</h1>
    <p>Похоже, вы офлайн. Проверьте подключение к интернету и попробуйте ещё раз.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
